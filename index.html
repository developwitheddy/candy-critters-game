<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Candy Critters!</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: linear-gradient(135deg, #ff9de2 0%, #ffcc70 50%, #a0f0a0 100%);
      min-height: 100vh;
      font-family: 'Comic Sans MS', 'Chalkboard SE', cursive;
      overflow: hidden;
      user-select: none;
    }

    #title {
      text-align: center;
      font-size: clamp(2rem, 8vw, 4rem);
      color: #fff;
      text-shadow: 4px 4px 0 #e040a0, 8px 8px 0 rgba(0,0,0,0.1);
      padding: 16px 0 4px;
      letter-spacing: 2px;
    }

    #score-bar {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 24px;
      padding: 8px 0 12px;
    }

    .score-box {
      background: rgba(255,255,255,0.7);
      border-radius: 24px;
      padding: 6px 22px;
      font-size: clamp(1.2rem, 4vw, 1.8rem);
      color: #d4006e;
      font-weight: bold;
      box-shadow: 0 3px 8px rgba(0,0,0,0.15);
    }

    #game-area {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      gap: clamp(10px, 3vw, 24px);
      padding: clamp(8px, 2vw, 20px) clamp(8px, 3vw, 30px);
      max-width: 900px;
      margin: 0 auto;
    }

    .critter {
      width: clamp(90px, 18vw, 150px);
      height: clamp(90px, 18vw, 150px);
      border-radius: 50%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      border: 6px solid rgba(255,255,255,0.8);
      box-shadow: 0 6px 20px rgba(0,0,0,0.2);
      transition: transform 0.15s, box-shadow 0.15s;
      position: relative;
      animation: float 3s ease-in-out infinite;
    }

    .critter:nth-child(odd)  { animation-delay: -1.5s; }
    .critter:nth-child(3n)   { animation-delay: -0.8s; }

    @keyframes float {
      0%, 100% { transform: translateY(0px) scale(1); }
      50%       { transform: translateY(-8px) scale(1.03); }
    }

    .critter:active {
      transform: scale(0.88) !important;
      box-shadow: 0 2px 8px rgba(0,0,0,0.15) !important;
    }

    .critter .emoji {
      font-size: clamp(2.5rem, 8vw, 4.5rem);
      line-height: 1;
      pointer-events: none;
    }

    .critter .label {
      font-size: clamp(0.6rem, 2.5vw, 0.9rem);
      color: rgba(255,255,255,0.95);
      font-weight: bold;
      text-shadow: 1px 1px 2px rgba(0,0,0,0.3);
      pointer-events: none;
      margin-top: 2px;
    }

    .pop-anim {
      animation: pop 0.35s ease forwards !important;
    }

    @keyframes pop {
      0%   { transform: scale(1); opacity: 1; }
      40%  { transform: scale(1.4); opacity: 0.8; }
      100% { transform: scale(0); opacity: 0; }
    }

    #burst-canvas {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      pointer-events: none;
      z-index: 10;
    }

    #target-banner {
      text-align: center;
      font-size: clamp(1.4rem, 5vw, 2.4rem);
      color: #fff;
      text-shadow: 2px 2px 0 #a0006a;
      margin-bottom: 4px;
    }

    #target-emoji {
      display: inline-block;
      animation: wiggle 0.6s ease-in-out infinite alternate;
    }

    @keyframes wiggle {
      from { transform: rotate(-10deg) scale(1); }
      to   { transform: rotate(10deg) scale(1.1); }
    }

    #win-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(255, 220, 100, 0.88);
      z-index: 20;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
    }

    #win-overlay.show { display: flex; }

    #win-text {
      font-size: clamp(2.5rem, 12vw, 6rem);
      color: #d4006e;
      text-shadow: 4px 4px 0 #fff;
      text-align: center;
      animation: bounce 0.5s ease infinite alternate;
    }

    @keyframes bounce {
      from { transform: scale(1); }
      to   { transform: scale(1.08); }
    }

    #play-btn {
      background: #ff4daa;
      color: #fff;
      border: none;
      border-radius: 50px;
      padding: clamp(14px, 3vw, 22px) clamp(36px, 8vw, 64px);
      font-size: clamp(1.4rem, 5vw, 2.2rem);
      font-family: inherit;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 6px 0 #b5006e;
      transition: transform 0.1s, box-shadow 0.1s;
      letter-spacing: 1px;
    }

    #play-btn:active {
      transform: translateY(4px);
      box-shadow: 0 2px 0 #b5006e;
    }

    .stars { font-size: clamp(2rem, 8vw, 4rem); }

    #wrong-flash {
      position: fixed;
      inset: 0;
      background: rgba(255, 60, 60, 0.35);
      pointer-events: none;
      opacity: 0;
      z-index: 15;
      transition: opacity 0.05s;
    }
  </style>
</head>
<body>

<div id="title">🍬 Candy Critters! 🍬</div>

<div id="score-bar">
  <div class="score-box">⭐ <span id="score">0</span></div>
  <div class="score-box">❤️ <span id="lives">3</span></div>
</div>

<div id="target-banner">
  Find: <span id="target-emoji"></span> <span id="target-name"></span>
</div>

<div id="game-area"></div>

<canvas id="burst-canvas"></canvas>
<div id="wrong-flash"></div>

<div id="win-overlay">
  <div id="win-text">🎉 Amazing! 🎉</div>
  <div class="stars">⭐⭐⭐</div>
  <button id="play-btn" onclick="startGame()">Play Again!</button>
</div>

<script>
const CRITTERS = [
  { emoji: '🐱', name: 'Cat',        color: '#FFB347' },
  { emoji: '🐶', name: 'Dog',        color: '#FF7F7F' },
  { emoji: '🐸', name: 'Frog',       color: '#77DD77' },
  { emoji: '🦊', name: 'Fox',        color: '#FF9966' },
  { emoji: '🐼', name: 'Panda',      color: '#B0B0FF' },
  { emoji: '🐨', name: 'Koala',      color: '#AABBCC' },
  { emoji: '🦁', name: 'Lion',       color: '#FFD966' },
  { emoji: '🐮', name: 'Cow',        color: '#EEB8FF' },
  { emoji: '🐧', name: 'Penguin',    color: '#99DDFF' },
  { emoji: '🦋', name: 'Butterfly',  color: '#FF99CC' },
  { emoji: '🐢', name: 'Turtle',     color: '#66CC99' },
  { emoji: '🦄', name: 'Unicorn',    color: '#CC99FF' },
];

const GRID_SIZE = 6; // critters shown at once
const WIN_SCORE = 10;

let score = 0;
let lives = 3;
let target = null;
let busy = false;

const gameArea   = document.getElementById('game-area');
const scoreEl    = document.getElementById('score');
const livesEl    = document.getElementById('lives');
const targetEmoji = document.getElementById('target-emoji');
const targetName  = document.getElementById('target-name');
const winOverlay = document.getElementById('win-overlay');
const winText    = document.getElementById('win-text');
const flash      = document.getElementById('wrong-flash');
const canvas     = document.getElementById('burst-canvas');
const ctx        = canvas.getContext('2d');

let particles = [];
let rafId = null;

function resizeCanvas() {
  canvas.width  = window.innerWidth;
  canvas.height = window.innerHeight;
}
window.addEventListener('resize', resizeCanvas);
resizeCanvas();

// ---- Audio (Web Audio API simple tones) ----
let audioCtx = null;
function getAudio() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  return audioCtx;
}

function playTone(freq, type, dur, vol = 0.4) {
  try {
    const ac = getAudio();
    const osc = ac.createOscillator();
    const gain = ac.createGain();
    osc.connect(gain); gain.connect(ac.destination);
    osc.type = type;
    osc.frequency.setValueAtTime(freq, ac.currentTime);
    osc.frequency.exponentialRampToValueAtTime(freq * 1.5, ac.currentTime + dur * 0.5);
    gain.gain.setValueAtTime(vol, ac.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + dur);
    osc.start(); osc.stop(ac.currentTime + dur);
  } catch(e) {}
}

function playCorrect() {
  playTone(523, 'sine', 0.12);
  setTimeout(() => playTone(659, 'sine', 0.12), 100);
  setTimeout(() => playTone(784, 'sine', 0.25), 200);
}

function playWrong() {
  playTone(200, 'sawtooth', 0.25, 0.2);
}

function playWin() {
  [523, 659, 784, 1047].forEach((f, i) => setTimeout(() => playTone(f, 'sine', 0.3), i * 120));
}

// ---- Particles ----
function burst(x, y, color) {
  for (let i = 0; i < 30; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = 2 + Math.random() * 7;
    particles.push({
      x, y,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed - 3,
      size: 6 + Math.random() * 10,
      color,
      alpha: 1,
      shape: Math.random() > 0.5 ? 'circle' : 'star',
    });
  }
  if (!rafId) rafLoop();
}

function rafLoop() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  particles.forEach(p => {
    p.x += p.vx; p.y += p.vy; p.vy += 0.25;
    p.alpha -= 0.025;
    ctx.globalAlpha = Math.max(0, p.alpha);
    ctx.fillStyle = p.color;
    ctx.beginPath();
    if (p.shape === 'circle') {
      ctx.arc(p.x, p.y, p.size / 2, 0, Math.PI * 2);
    } else {
      drawStar(ctx, p.x, p.y, 5, p.size / 2, p.size / 4);
    }
    ctx.fill();
  });
  ctx.globalAlpha = 1;
  particles = particles.filter(p => p.alpha > 0);
  if (particles.length > 0) rafId = requestAnimationFrame(rafLoop);
  else rafId = null;
}

function drawStar(ctx, cx, cy, spikes, outerR, innerR) {
  let rot = (Math.PI / 2) * 3;
  const step = Math.PI / spikes;
  ctx.moveTo(cx, cy - outerR);
  for (let i = 0; i < spikes; i++) {
    ctx.lineTo(cx + Math.cos(rot) * outerR, cy + Math.sin(rot) * outerR);
    rot += step;
    ctx.lineTo(cx + Math.cos(rot) * innerR, cy + Math.sin(rot) * innerR);
    rot += step;
  }
  ctx.lineTo(cx, cy - outerR);
  ctx.closePath();
}

// ---- Game logic ----
function pickTarget(pool) {
  return pool[Math.floor(Math.random() * pool.length)];
}

function buildGrid() {
  // Pick GRID_SIZE unique critters, ensure target is among them
  const shuffled = [...CRITTERS].sort(() => Math.random() - 0.5);
  const chosen = shuffled.slice(0, GRID_SIZE);
  if (!chosen.find(c => c.emoji === target.emoji)) {
    chosen[Math.floor(Math.random() * GRID_SIZE)] = target;
  }
  return chosen.sort(() => Math.random() - 0.5);
}

function renderGrid(critters) {
  gameArea.innerHTML = '';
  critters.forEach(c => {
    const div = document.createElement('div');
    div.className = 'critter';
    div.style.background = c.color;
    div.innerHTML = `<span class="emoji">${c.emoji}</span><span class="label">${c.name}</span>`;
    div.dataset.emoji = c.emoji;
    div.addEventListener('click', () => onCritterClick(div, c));
    gameArea.appendChild(div);
  });
}

function onCritterClick(div, critter) {
  if (busy) return;
  busy = true;

  const rect = div.getBoundingClientRect();
  const cx = rect.left + rect.width / 2;
  const cy = rect.top  + rect.height / 2;

  if (critter.emoji === target.emoji) {
    // Correct!
    score++;
    scoreEl.textContent = score;
    playCorrect();
    burst(cx, cy, critter.color);
    div.classList.add('pop-anim');
    setTimeout(() => {
      if (score >= WIN_SCORE) {
        showWin();
      } else {
        nextRound();
      }
    }, 380);
  } else {
    // Wrong
    lives--;
    livesEl.textContent = lives;
    playWrong();
    flashRed();
    shakeDiv(div);
    setTimeout(() => {
      if (lives <= 0) {
        showGameOver();
      } else {
        busy = false;
      }
    }, 500);
  }
}

function shakeDiv(el) {
  el.animate([
    { transform: 'translateX(0)' },
    { transform: 'translateX(-10px)' },
    { transform: 'translateX(10px)' },
    { transform: 'translateX(-8px)' },
    { transform: 'translateX(8px)' },
    { transform: 'translateX(0)' },
  ], { duration: 400 });
}

function flashRed() {
  flash.style.opacity = '1';
  setTimeout(() => { flash.style.opacity = '0'; }, 300);
}

function nextRound() {
  target = pickTarget(CRITTERS);
  targetEmoji.textContent = target.emoji;
  targetName.textContent  = target.name;
  renderGrid(buildGrid());
  busy = false;
}

function showWin() {
  playWin();
  winText.textContent = '🎉 Amazing! 🎉';
  winOverlay.classList.add('show');
}

function showGameOver() {
  winText.textContent = '💔 Try Again!';
  winOverlay.classList.add('show');
}

function startGame() {
  score = 0; lives = 3;
  scoreEl.textContent = '0';
  livesEl.textContent = '3';
  winOverlay.classList.remove('show');
  busy = false;
  nextRound();
}

startGame();
</script>
</body>
</html>
